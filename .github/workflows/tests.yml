name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  tests:
    name: Godot tests and asset pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 4 -o /tmp/godot.zip "$url"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Put Godot on PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$HOME/godot/godot" --headless --version

      - name: Set up Python (asset pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install asset pipeline dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Validate assets
        run: |
          if [ -f tools/assets/pipeline.py ]; then
            python3 tools/assets/pipeline.py validate
          else
            echo "No asset pipeline in this revision; skipping."
          fi

      # run_tests.sh runs the GDScript suite and, when Pillow and numpy are
      # available, the asset pipeline unit tests and the stale-atlas check.
      - name: Run tests
        run: ./run_tests.sh
